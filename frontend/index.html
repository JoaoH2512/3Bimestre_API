<!-- index.html -->
<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='UTF-8'>
    <title>Produtos</title>
</head>

<body>
    <h1>Lista de Produtos</h1>
    <ul id='lista-produtos'></ul>
    <script>
        fetch('http://127.0.0.1:8000/produtos')
            .then(resposta => resposta.json())
            .then(produtos => {
                const lista = document.getElementById('lista-produtos');
                produtos.forEach(produto => {
                    const item = document.createElement('li');
                    item.textContent =
                        `${produto.nome} - R$ ${produto.preco} (qtd: ${produto.quantidade})`;
                    lista.appendChild(item);
                });
            })
            .catch(erro => console.error('Erro ao buscar produtos:',
                erro));
    </script>
    <br>
    <h1>Lista de Pets</h1>
    <ul id='lista-pets'></ul>
    <script>
        fetch('http://127.0.0.1:8000/pets')
            .then(resposta => resposta.json())
            .then(pets => {
                const lista = document.getElementById('lista-pets');
                pets.forEach(pet => {
                    const item = document.createElement('li');
                    item.textContent =
                        `${pet.nome}   - Especie: ${pet.especie}- Raça: ${pet.raca} (idade: ${pet.idade}) `;
                    lista.appendChild(item);
                });
            })
            .catch(erro => console.error('Erro ao buscar pets:',
                erro));
    </script>
</body>

</html>
